name: Build and Deploy Standalone Game

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: meowa-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: HD2D-pokemon-threejs

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: HD2D-pokemon-threejs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build true standalone HTML
        run: npm run build:standalone

      - name: Verify Blogger-safe source
        run: |
          test -s dist/standalone.html
          python3 - <<'PY'
          from pathlib import Path
          data = Path("dist/standalone.html").read_bytes()
          assert all(b < 128 for b in data), "standalone.html contains non-ASCII source bytes"
          print("standalone bytes:", len(data))
          PY

      - name: Prepare Pages site
        run: |
          rm -rf pages-site
          mkdir -p pages-site
          cp dist/standalone.html pages-site/index.html
          cp dist/standalone.html pages-site/meowa-games-standalone.html
          cd dist
          zip -9 meowa-games-standalone.zip standalone.html

      - name: Upload standalone download
        uses: actions/upload-artifact@v4
        with:
          name: meowa-games-standalone
          path: |
            HD2D-pokemon-threejs/dist/standalone.html
            HD2D-pokemon-threejs/dist/meowa-games-standalone.zip
          compression-level: 0
          retention-days: 30

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: HD2D-pokemon-threejs/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
